worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Detailed access log tracking upstream server routing and HTTP Range requests
    log_format streamops_log '$remote_addr - $remote_user [$time_local] "$request" '
                             '$status $body_bytes_sent "$http_referer" '
                             '"$http_user_agent" upstream: $upstream_addr '
                             'status: $upstream_status range: "$http_range"';

    access_log /var/log/nginx/access.log streamops_log;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Upstream pool for FastAPI backend instances (Round-Robin with passive failover)
    upstream backend_servers {
        server backend1:8000 max_fails=3 fail_timeout=10s;
        server backend2:8000 max_fails=3 fail_timeout=10s;
    }

    # Upstream pool for React frontend container
    upstream frontend_server {
        server frontend:80;
    }

    server {
        listen 80;
        server_name localhost;

        # Gateway health check endpoint
        location /healthz {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Internal NGINX metrics endpoint for Prometheus exporter (restricted to local/private subnets)
        location /stub_status {
            stub_status;
            access_log off;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
        }

        # Route API requests to load-balanced FastAPI backend instances with resilience failover
        location /api/ {
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;

            # Upstream resilience: fast connect timeout and safe failover for idempotent requests
            proxy_connect_timeout 2s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 10s;

            # Essential for video seeking via HTTP Range requests (RFC 7233)
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;

            # Standard proxy routing headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Disable proxy buffering for low-latency video streaming
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            # Diagnostic headers exposing which backend container answered the request
            add_header X-Upstream-Addr $upstream_addr always;
            add_header X-Load-Balancer "StreamOps-NGINX-Gateway" always;
        }

        # FastAPI Interactive API documentation & OpenAPI schema
        location ~ ^/(docs|openapi\.json) {
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header X-Upstream-Addr $upstream_addr always;
            add_header X-Load-Balancer "StreamOps-NGINX-Gateway" always;
        }

        # Route all frontend SPA requests to the React frontend NGINX container
        location / {
            proxy_pass http://frontend_server;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
